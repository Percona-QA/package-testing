  - name: include playbook for removing Percona repo
    include_tasks: remove_percona_repository.yml

  - name: disable the mysql module on RHEL/CentOS 8
    command: /usr/bin/dnf module disable mysql -y
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

  - name: Install percona repository package
    apt:
      deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
    when: ansible_os_family == "Debian"

  - name: Add the Percona Release yum repo without GPG check
    yum:
      name: https://repo.percona.com/yum/percona-release-latest.noarch.rpm
      disable_gpg_check: yes
    when: ansible_os_family == "RedHat"
  
  # The private EOL apt repo's InRelease is signed with the Percona key
  # (9334A25F8507EFA5), which percona-release does not install. Fetch the Percona
  # keyring into trusted.gpg.d so "apt update" can verify the EOL repo signature.
  - name: Download Percona GPG key for the EOL apt repo
    ansible.builtin.get_url:
      url: https://github.com/percona/percona-repositories/raw/main/deb/percona-keyring.gpg
      dest: /tmp/percona-keyring.gpg
      mode: '0644'
    when:
      - ansible_os_family == "Debian"
      - lookup('env', 'eol') == "yes"

  - name: Install Percona GPG key for the EOL apt repo
    ansible.builtin.copy:
      src: /tmp/percona-keyring.gpg
      dest: /etc/apt/trusted.gpg.d/percona-keyring.gpg
      remote_src: yes
      mode: '0644'
    when:
      - ansible_os_family == "Debian"
      - lookup('env', 'eol') == "yes"

  - name: add eol testing repository on debian
    template: src=../templates/eol_deb_repo_file_pxc80.j2
              dest=/etc/apt/sources.list.d/post-eol.list
    vars:
      client_id: "{{ lookup('env', 'USERNAME') }}"
      client_token: "{{ lookup('env', 'PASSWORD') }}"
      repo: "testing"
    when:
      - ansible_os_family == "Debian"
      - lookup('env', 'eol') == "yes"

  - name: add eol testing repository on Redhat AMD
    template: src=../templates/eol_rpm_repo_file_pxc80.j2
             dest=/etc/yum.repos.d/post-eol.repo
    vars:
      client_id: "{{ lookup('env', 'USERNAME') }}"
      client_token: "{{ lookup('env', 'PASSWORD') }}"
      repo: "testing"
    when:
      - ansible_os_family == "RedHat"
      - ansible_architecture == "x86_64"
      - lookup('env', 'eol') == "yes"

  - name: add eol testing repository on Redhat ARM
    template: src=../templates/eol_rpm_repo_file_pxc80_arm.j2
             dest=/etc/yum.repos.d/post-eol.repo
    vars:
      client_id: "{{ lookup('env', 'USERNAME') }}"
      client_token: "{{ lookup('env', 'PASSWORD') }}"
      repo: "testing"
    when:
      - ansible_os_family == "RedHat"
      - ansible_architecture == "aarch64" or ansible_architecture == "arm64"
      - lookup('env', 'eol') == "yes"

  - name: Clean and update package cache
    shell: |
      {{ ansible_pkg_mgr }} clean all
      {{ ansible_pkg_mgr }} makecache
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon", "Rocky"]

  - name: Add pxc-80 testing repo for qpress
    command: percona-release enable-only pxc-80 testing
    when:
      - lookup('env', 'eol') == "no"


  - name: add the testing tools repo
    command: percona-release enable tools release

  - name: enable pxb repo
    command: percona-release enable pxb-80 release

  - name: enable PT repo
    command: percona-release enable pt release
