---
# Installs the two external SBOM tools on the target host:
#   trivy         vulnerability scanning of the CycloneDX document
#   cyclonedx-cli schema validation against the spec version the document declares
#
# Deliberately NOT using the unarchive module for trivy. On oracle-8, oracle-9
# and rhel-8-arm it reported "ok" and installed nothing, and because the task
# carried failed_when: false the reason never reached the log -- the first sign
# of trouble was the check failing much later with "trivy is not installed".
# The cause turned out to be that those AMIs have no tar binary, which unarchive
# shells out to. Downloading and extracting explicitly does the same job while
# surfacing rc/stderr at every step, and the extraction avoids tar entirely.
#
# Failures here are still non-fatal for the play, but they are always REPORTED:
# the checks fail when SBOM_EXTERNAL_TOOLS is on, so "why" has to be in the log.
#
# Arch matters: the x86_64 asset on an aarch64 target gives an "Exec format
# error" that surfaces far from its cause.

- name: set SBOM tool asset names for this architecture
  set_fact:
    sbom_trivy_arch: "{{ 'ARM64' if ansible_architecture == 'aarch64' else '64bit' }}"
    sbom_cdx_asset: "{{ 'cyclonedx-linux-arm64' if ansible_architecture == 'aarch64' else 'cyclonedx-linux-x64' }}"
    # Pinned to match jenkins-pipelines/vars/installTrivy.groovy, the sanctioned
    # helper, so the molecule and docker jobs scan with the same version.
    sbom_trivy_version: "0.74.0"
    sbom_bindir: "{{ sbom_bindir | default('/usr/local/bin') }}"

# trivy is only installed when the vulnerability scan is actually wanted;
# SBOM_VULN_MODE=off skips a 49 MB download and a 168 MB binary on every target.
- name: decide whether trivy is needed
  set_fact:
    sbom_trivy_wanted: "{{ (sbom_vuln_mode | default('warn', true) | trim) != 'off' }}"

- name: find SBOM tools already on PATH
  shell: command -v trivy || true
  when: sbom_trivy_wanted | bool
  register: sbom_have_trivy
  changed_when: false
  failed_when: false

- name: find cyclonedx-cli already on PATH
  shell: command -v cyclonedx || true
  register: sbom_have_cyclonedx
  changed_when: false
  failed_when: false

# --- trivy: download, then extract just the binary ------------------------

- name: download the trivy tarball
  get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ sbom_trivy_version }}/trivy_{{ sbom_trivy_version }}_Linux-{{ sbom_trivy_arch }}.tar.gz"
    dest: /var/tmp/trivy.tar.gz
    mode: '0644'
    timeout: 60
  become: true
  when:
    - sbom_trivy_wanted | bool
    - sbom_have_trivy.stdout | default('') | trim | length == 0
  register: sbom_trivy_download
  ignore_errors: true

# Extracted with python's tarfile rather than the tar binary: the molecule EC2
# AMIs for oracle-9 (and others) do not ship tar, which is what broke this --
# first silently through the unarchive module, then visibly as
# "[Errno 2] No such file or directory: b'tar'". python3 is guaranteed on any
# ansible target, so this needs no package install and no repo access.
- name: extract the trivy binary
  command:
    argv:
      # discovered_interpreter_python, not ansible_python_interpreter: the
      # latter is usually undefined and can legitimately be the literal "auto".
      - "{{ ansible_facts.discovered_interpreter_python | default('/usr/bin/python3', true) }}"
      - "-c"
      - "import tarfile, sys; tf = tarfile.open(sys.argv[1]); tf.extract('trivy', sys.argv[2]); tf.close()"
      - /var/tmp/trivy.tar.gz
      - "{{ sbom_bindir }}"
  become: true
  when:
    - sbom_trivy_wanted | bool
    - sbom_have_trivy.stdout | default('') | trim | length == 0
    - sbom_trivy_download is not failed
    - sbom_trivy_download is not skipped
  register: sbom_trivy_extract
  changed_when: sbom_trivy_extract.rc == 0
  ignore_errors: true

- name: make the trivy binary executable
  file:
    path: "{{ sbom_bindir }}/trivy"
    mode: '0755'
  become: true
  when:
    - sbom_trivy_wanted | bool
    - sbom_have_trivy.stdout | default('') | trim | length == 0
    - sbom_trivy_extract is not failed
    - sbom_trivy_extract is not skipped
  ignore_errors: true

- name: remove the trivy tarball
  file:
    path: /var/tmp/trivy.tar.gz
    state: absent
  become: true
  when: sbom_trivy_wanted | bool
  ignore_errors: true

# --- cyclonedx-cli: a single binary, no archive ---------------------------

- name: download cyclonedx-cli
  get_url:
    url: "https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/{{ sbom_cdx_asset }}"
    dest: "{{ sbom_bindir }}/cyclonedx"
    mode: '0755'
    timeout: 60
  become: true
  when: sbom_have_cyclonedx.stdout | default('') | trim | length == 0
  register: sbom_cyclonedx_download
  ignore_errors: true

# --- resolve, verify, report ----------------------------------------------

# The checks address the tools by absolute path rather than relying on PATH:
# this play runs under become/sudo, and sudo's secure_path on RHEL-family is
# "/sbin:/bin:/usr/sbin:/usr/bin" -- no /usr/local/bin, where these land.
- name: resolve the installed SBOM tool paths
  set_fact:
    sbom_trivy_bin: "{{ sbom_have_trivy.stdout | default('', true) | trim
                        or (sbom_bindir ~ '/trivy') }}"
    sbom_cyclonedx_bin: "{{ sbom_have_cyclonedx.stdout | default('', true) | trim
                            or (sbom_bindir ~ '/cyclonedx') }}"

# Actually run each tool, rather than trusting that a download reported success.
# DOTNET_SYSTEM_GLOBALIZATION_INVARIANT matches how external_tools.py invokes
# cyclonedx-cli: it is a self-contained .NET binary and refuses to start on a
# host without ICU unless invariant globalization is set.
- name: verify the SBOM tools run
  shell: |
    for entry in "trivy {{ sbom_trivy_bin }} {{ sbom_trivy_wanted | bool }}" \
                 "cyclonedx {{ sbom_cyclonedx_bin }} True"; do
      set -- $entry
      name=$1; path=$2; wanted=$3
      if [ "$wanted" != "True" ]; then
        # Deliberately not installed, so "MISSING" would read as a failure.
        echo "$name: NOT REQUESTED - its gate is off"
      elif [ ! -e "$path" ]; then
        echo "$name: MISSING - no file at $path"
      elif [ ! -x "$path" ]; then
        echo "$name: NOT EXECUTABLE at $path"
      elif out=$(DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 "$path" --version 2>&1 | head -1); then
        echo "$name: OK at $path ($out)"
      else
        echo "$name: PRESENT at $path but --version failed: $out"
      fi
    done
    exit 0
  args:
    executable: /bin/bash
  become: true
  register: sbom_tools_present
  changed_when: false
  failed_when: false

- name: show SBOM tool availability
  debug:
    var: sbom_tools_present.stdout_lines

# ignore_errors (not failed_when: false) is what makes these conditions work:
# failed_when: false sets failed=False on the result, so a "did it fail?" test
# can never be true -- which is why the earlier version of this reported nothing.
- name: report why an SBOM tool could not be installed
  debug:
    msg: >-
      {{ item.name }} {{ item.step }} failed:
      {{ item.result.msg | default(item.result.stderr | default('no error recorded')) }}
  when:
    - item.result is defined
    - item.result is failed
  loop:
    - { name: trivy, step: download, result: "{{ sbom_trivy_download | default({}) }}" }
    - { name: trivy, step: extraction, result: "{{ sbom_trivy_extract | default({}) }}" }
    - { name: cyclonedx-cli, step: download, result: "{{ sbom_cyclonedx_download | default({}) }}" }
  loop_control:
    label: "{{ item.name }} {{ item.step }}"
