---
# Collects the SBOM files shipped by an installed Percona product and sends them
# to the Jenkins agent. The checks themselves do NOT run here.
#
# Include with the product key from sbom_checks/products.py:
#
#   - include_tasks: ../tasks/check_sbom.yml
#     vars:
#       sbom_product: ps
#
# (tasks/check_pxb_sbom.yml is that include for PXB.)
#
# The target does only what needs the installed system: discovery (rpm -ql /
# dpkg -L, with the find fallback) and reading the installed package's name and
# version. sbom_checks.collect copies exactly the discovered files, plus a
# manifest, and the zip is fetched to $WORKSPACE_VAR. The job then runs the whole
# suite -- structure, consistency, licences, cyclonedx-cli, trivy -- once per
# platform on the agent (pytest-tests/test_<product>_sbom.py with SBOM_FETCHED
# set; runSbomChecks in the jenkins-pipelines shared library).
#
# Running the tools on every target caused most of this suite's operational
# trouble: tar missing on some AMIs, sudo secure_path hiding /usr/local/bin,
# wrong-architecture binaries, cyclonedx-cli needing ICU, and a 1.4 GB trivy
# database per target filling small root filesystems. None of it applies here.
#
# Never fails the converge. A collection that goes wrong still leaves a manifest
# saying so, and a platform that sends nothing at all is reported by the agent
# as missing (SBOM_EXPECTED_PLATFORMS) -- so an SBOM problem is always visible,
# without stopping the backup tests that follow.

# Before anything writes them. molecule's test_sequence destroys and recreates
# the instance, so a Jenkins run always starts clean -- but a local "molecule
# converge" re-run against a surviving target does not, and a run that produced
# nothing would otherwise fetch the PREVIOUS run's zip under this platform name.
- name: check which product to collect
  assert:
    that:
      - sbom_product is defined
      - sbom_product in ['pxb', 'ps']
    fail_msg: "sbom_product must be set to pxb or ps (got: {{ sbom_product | default('unset') }})"
    quiet: true

- name: set the SBOM collection paths
  set_fact:
    sbom_out_dir: "/var/tmp/{{ sbom_product }}_sbom"

- name: remove SBOM artifacts left by any previous run
  file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ sbom_out_dir }}"
    - "{{ sbom_out_dir }}.zip"
  failed_when: false
  changed_when: false

- name: get the arch value
  shell: uname -m
  register: sbom_arch_output
  changed_when: false

- name: get the PRETTY_NAME value from /etc/os-release
  shell: |
    grep '^PRETTY_NAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"'
  register: sbom_pretty_name_output
  changed_when: false

- name: resolve the controller workspace
  set_fact:
    # WORKSPACE_VAR is an ENVIRONMENT variable set by the Jenkins job, not an
    # ansible variable -- ansible does not import the environment. The molecule
    # cleanup playbooks bridge it with this same lookup in their own play-level
    # vars:, but this file is included from the converge play, which has none.
    sbom_workspace: "{{ lookup('env', 'WORKSPACE_VAR') | default('', true) | trim }}"

- name: resolve the platform label
  set_fact:
    # The agent names every result after this, e.g. test_x[rocky-8], and checks
    # it against the platforms the job launched -- so it must be the molecule
    # scenario name, which is what the job's platform list uses. Falls back to
    # OS/arch so it is never empty outside molecule.
    sbom_platform_label: >-
      {{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default('', true) | trim
         or (sbom_pretty_name_output.stdout | replace(' ', '-') | trim
             ~ '_' ~ sbom_arch_output.stdout | trim) }}

- name: build the artifact name
  set_fact:
    # Platforms run in parallel into one WORKSPACE_VAR, so the name must be
    # unique per host. replace('/') as well as the space: PRETTY_NAME on Debian
    # is "Debian GNU/Linux 12 (bookworm)", and a slash would make the fetch dest
    # a SUBDIRECTORY that the job's non-recursive '*_sbom.zip' glob never sees.
    # The agent reads the platform from the manifest, not from this name.
    sbom_artifact_prefix: >-
      {{ ansible_hostname }}_{{ sbom_pretty_name_output.stdout | replace(' ', '-') | replace('/', '-') | trim }}_{{ sbom_arch_output.stdout | trim }}

- name: collect the {{ sbom_product }} SBOM files
  command:
    # argv form: no shell, no quoting, nothing for ansible's argument splitter
    # to trip over.
    argv:
      - python3
      - -m
      - sbom_checks.collect
      - --product
      - "{{ sbom_product }}"
      - --label
      - "{{ sbom_platform_label }}"
      - --out
      - "{{ sbom_out_dir }}"
    chdir: /package-testing
  environment:
    # The escape hatch for pointing discovery at a directory by hand.
    SBOM_DIR: "{{ lookup('env', 'SBOM_DIR') | default('', true) }}"
  become: true
  register: sbom_collect
  changed_when: false
  failed_when: false

- name: show the SBOM collection
  debug:
    var: sbom_collect.stdout_lines

- name: show why the SBOM collection failed
  debug:
    var: sbom_collect.stderr_lines
  when: sbom_collect.rc | default(1) != 0

# The collector writes a manifest even when it finds nothing or discovery fails;
# only a crash leaves none. The agent then reports this platform as missing.
- name: check that the collection produced a manifest
  stat:
    path: "{{ sbom_out_dir }}/manifest.json"
  become: true
  register: sbom_manifest
  failed_when: false

- name: archive the collected SBOM files
  archive:
    path: "{{ sbom_out_dir }}"
    dest: "{{ sbom_out_dir }}.zip"
    format: zip
  become: true
  failed_when: false
  when: sbom_manifest.stat.exists | default(false)

- name: report that artifacts will not be fetched
  debug:
    msg: >-
      WORKSPACE_VAR is not set, so the SBOM collection stays on the target in
      /var/tmp/. This is expected outside Jenkins.
  when: sbom_workspace | length == 0

# A stat rather than "the archive task succeeded": that task carries
# failed_when: false, which forces failed=False, so testing its result would
# always pass. The zip was removed at the start, so existing now means made now.
- name: check that the SBOM zip was produced
  stat:
    path: "{{ sbom_out_dir }}.zip"
  become: true
  register: sbom_zip
  failed_when: false

- name: fetch the SBOM collection to the controller
  fetch:
    src: "{{ sbom_out_dir }}.zip"
    # The product is in the name so two collections from one host cannot
    # overwrite each other; the agent's '*_sbom.zip' glob still matches.
    dest: "{{ sbom_workspace }}/{{ sbom_artifact_prefix }}_{{ sbom_product }}_sbom.zip"
    flat: yes
  become: true
  when:
    - sbom_workspace | length > 0
    - sbom_zip.stat.exists | default(false)
  ignore_errors: yes
