# This task installs percona-mysql-shell
#

  - name: install percona-mysql-shell deb packages
    apt:
      name: "{{ packages }}"
      update_cache: yes
      state: latest
    vars:
      packages:
      - percona-mysql-shell
    when: ansible_os_family == "Debian"

  # percona-mysql-shell-dbgsym is published only for Debian, not for Ubuntu
  - name: install percona-mysql-shell-dbgsym deb package on Debian
    apt:
      name: percona-mysql-shell-dbgsym
      update_cache: yes
      state: latest
    when: ansible_distribution == "Debian"

  - name: install percona-mysql-shell new rpm packages using yum
    yum:
      name: "{{ packages }}"
      state: latest
    vars:
      packages:
      - percona-mysql-shell
      - percona-mysql-shell-debuginfo
      - percona-mysql-shell-debugsource
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon"]
      - ansible_facts['distribution_major_version'] | int <= 7

  - name: install percona-mysql-shell new rpm packages using dnf
    dnf:
      name: "{{ packages }}"
      state: latest
    vars:
      packages:
      - percona-mysql-shell
      - percona-mysql-shell-debuginfo
      - percona-mysql-shell-debugsource
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon", "Rocky"]
      - ansible_facts['distribution_major_version'] | int >= 8
