---
# This playbook does the following:
#   enables Percona testing repository
#   installs latest version of PyKmip, PS 9.7, PXB 9.7 and runs some tests

- hosts: all
  become: true
  become_method: sudo
  vars:
    gnupg_home: /root/.gnupg
    percona_key1: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    percona_key1_file: "{{ gnupg_home }}/PERCONA-PACKAGING-KEY"
    kmip_venv: /opt/kmip-venv
  tasks:
  - name: include tasks for test env setup
    include_tasks: ../tasks/test_prep.yml

  - name: disable selinux for RedHat/CentOS
    selinux: state=disabled
    when: ansible_os_family == "RedHat"

  - name: include tasks for enabling PS 97 test repo
    include_tasks: ../tasks/enable_ps97_main_repo.yml
    when:
      - lookup('env', 'install_repo') == "main"

  - name: include tasks for enabling PS 97 test repo
    include_tasks: ../tasks/enable_ps97_testing_repo.yml
    when:
      - lookup('env', 'install_repo') == "testing" or lookup('env', 'install_repo') == ""

  - name: include tasks for enabling PS 97 experimental repo
    include_tasks: ../tasks/enable_ps97_experimental_repo.yml
    when:
      - lookup('env', 'install_repo') == "experimental"

  - name: download and extract world database
    command: "{{ item }}"
    with_items:
    - wget --no-check-certificate -P /package-testing https://raw.githubusercontent.com/Percona-QA/percona-qa/master/sample_db/world.sql

  - name: install Percona Server 9.7 packages
    include_tasks: ../tasks/install_ps97.yml
    when:
      - lookup('env', 'server_to_test') == "ps-97"

# INSTALL MS 

  - name: Extract PXB major and minor version number using shell commands
    shell: cat /package-testing/VERSIONS | grep 'PXB97_VER' | cut -d'=' -f2 | sed 's/"//g'
    register: pxb_version_major_minor_register

  - name: Extract PXB major version number using shell commands
    shell: cat /package-testing/VERSIONS | grep PXB97_VER | awk -F'[=".]' '{print $3"."$4}'
    register: pxb_version_major_register

  - name: Extract version number using shell commands
    shell: cat /package-testing/VERSIONS | grep -oP 'PXB97_VER="\K(\d+)\.(\d+)' | tr -d '.'
    register: major_release_version_register

  - name: Set major_release_version variable
    set_fact:
      major_release_version_reg: "{{ major_release_version_register.stdout }}"

  - name: Set pxb_version_major variable
    set_fact:
      pxb_version_major_reg: "{{ pxb_version_major_register.stdout }}"

  - name: Set pxb_version_major_minor variable
    set_fact:
      pxb_version_major_minor_reg: "{{ pxb_version_major_minor_register.stdout }}"

  - name: DEBUG  PXB version number
    debug:
      msg: "PXB version number is {{ pxb_version_major_reg }} {{ pxb_version_major_minor_reg }}"

  - name: install MYSQL MS Server {{ pxb_version_major_reg }} packages
    include_tasks: ../tasks/install_ms_innovation.yml
    vars:
      pxb_version_major: "{{ pxb_version_major_reg }}"
      pxb_version_major_minor: "{{ pxb_version_major_minor_reg }}"
    when:
      - lookup('env', 'server_to_test') == "ms-97"

##

#  - name: install sysbench new deb packages
#    include_tasks: ../tasks/install_sysbench.yml
#    when: lookup('env', 'install_repo') != "experimental" and ansible_distribution_release != "bullseye"

  - name: list installed packages
    include_tasks: ../tasks/list_installed_packages.yml

#  - name: List the services available
#    shell: systemctl list-units --type=service | grep mysqld
#    register: services
#
#  - name: Print the services
#    debug:
#      var: services

  - name: stop mysql service RHEL
    service: name=mysqld state=stopped
    when: ansible_os_family == "RedHat"

  - name: stop mysql service DEBIAN
    service: name=mysql state=stopped
    when: ansible_os_family == "Debian"

#  - name: remove mysql data directory
#    command: rm -r /var/lib/mysql

  - name: install python3-pip on RedHat/CentOS
    yum:
      name:
      - python3-pip
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  # python3-venv is required to create the isolated virtualenv below.
  - name: install python3-pip and python3-venv on Debian/Ubuntu
    apt:
      name:
        - python3-pip
        - python3-venv
      state: present
      update_cache: yes
    when: ansible_os_family == "Debian"

  # PyKMIP needs a Python in the 3.7 - 3.11 range: modern pykmip/cryptography
  # require Python >= 3.7 (and no cryptography wheels ship for the old versions
  # that still support 3.6, especially on aarch64), while ssl.wrap_socket() -
  # which pykmip relies on - was removed in Python 3.12. Distros outside that
  # range ship no suitable interpreter in their repos: RHEL 8 has only python 3.6,
  # and RHEL 10 / Ubuntu 24.04+ / Debian 13 have only python >= 3.12. On those we
  # build the venv with a self-contained, portable CPython 3.11 from
  # python-build-standalone (the same prebuilt CPython uv uses) - a static tarball
  # that runs on any glibc Linux and both amd64/arm64, with no OS dependency and
  # no patching of pykmip. Distros whose system python is already 3.7 - 3.11 keep
  # using the system python3.
  - name: detect system python3 minor version
    command: python3 -c "import sys; print(sys.version_info[1])"
    register: sys_py_minor
    changed_when: false

  - name: default the pykmip venv interpreter to the system python3
    set_fact:
      kmip_py_interp: python3

  - name: provision a portable CPython 3.11 when system python is < 3.7 or >= 3.12
    when: (sys_py_minor.stdout | int) < 7 or (sys_py_minor.stdout | int) >= 12
    block:
      - name: download portable CPython 3.11 (python-build-standalone)
        get_url:
          url: "https://github.com/astral-sh/python-build-standalone/releases/download/{{ pbs_tag }}/cpython-{{ pbs_ver }}+{{ pbs_tag }}-{{ (ansible_architecture == 'aarch64') | ternary('aarch64', 'x86_64') }}-unknown-linux-gnu-install_only.tar.gz"
          dest: /tmp/cpython-3.11-standalone.tar.gz
          mode: '0644'
        vars:
          pbs_tag: "20260807"
          pbs_ver: "3.11.15"
        register: pbs_dl
        retries: 3
        delay: 5
        until: pbs_dl is succeeded

      - name: extract portable CPython 3.11 into /opt
        unarchive:
          src: /tmp/cpython-3.11-standalone.tar.gz
          dest: /opt
          remote_src: yes
          creates: /opt/python/bin/python3.11

      - name: use the portable CPython 3.11 for the pykmip venv
        set_fact:
          kmip_py_interp: /opt/python/bin/python3.11

  - name: show the python interpreter chosen for the pykmip venv
    debug:
      msg: "system python3 minor=3.{{ sys_py_minor.stdout }} -> venv interpreter: {{ kmip_py_interp }}"

  # Install the KMIP test Python dependencies into an isolated virtualenv rather
  # than the OS-managed system Python. This sidesteps the PEP 668
  # "externally-managed-environment" restriction (Debian 12+/Ubuntu 24.04+)
  # entirely, so no --break-system-packages override is needed on any distro,
  # and it works on old pip (Ubuntu 22.04/Jammy) too. The pip module creates the
  # venv automatically via virtualenv_command when it does not yet exist.
  # Bootstrap a modern pip/setuptools/wheel into the venv FIRST, in its own
  # invocation. An old venv pip (e.g. the pip 9.0.3 that an old system python3
  # would seed) cannot use prebuilt wheels for cryptography and instead tries to
  # build it from source (requiring Rust/setuptools_rust) and fails. Upgrading pip
  # before installing pykmip lets the new pip fetch the cryptography manylinux
  # wheel. (RHEL 8 now uses the portable CPython 3.11 above, which already ships a
  # modern pip, but this bootstrap stays as a safety net for any interpreter.)
  - name: bootstrap pip/setuptools/wheel in the virtualenv
    pip:
      name:
        - pip
        - setuptools
        - wheel
      state: latest
      virtualenv: "{{ kmip_venv }}"
      virtualenv_command: "{{ kmip_py_interp }} -m venv"

  - name: install pykmip dependencies into the virtualenv
    pip:
      name:
        - importlib-metadata
        - pykmip
      state: latest
      virtualenv: "{{ kmip_venv }}"
      virtualenv_command: "{{ kmip_py_interp }} -m venv"

  # pykmip requires SQLAlchemy < 2.0; pin to a known-good version in the venv.
  - name: pin SQLAlchemy in the virtualenv
    pip:
      name: SQLAlchemy==1.4.46
      virtualenv: "{{ kmip_venv }}"

  # Capture stdout AND stderr to /pykmip_server.out. An uncaught exception in the
  # server (e.g. SSL/cipher setup failing) is written to stderr, NOT to the -l
  # logging file, so without this the crash traceback is lost to nohup.out.
  - name: start pykmip server
    shell: nohup {{ kmip_venv }}/bin/pykmip-server -f /package-testing/kmip/server.conf -l /pykmip_server.log > /pykmip_server.out 2>&1 &

  # Observation only (no behaviour change yet): give the server a few seconds to
  # come up, then report whether the process is alive, whether port 5696 is
  # reachable, and dump the server log. mysqld starts later with the KMIP keyring
  # component and aborts with "BIO_do_connect: Connection refused" if the server
  # is not reachable, so this surfaces the actual cause before that happens.
  - name: wait a few seconds for pykmip server to come up
    pause:
      seconds: 5

  - name: check pykmip server process is running
    shell: pgrep -af pykmip-server
    register: pykmip_status
    changed_when: false
    failed_when: false

  - name: check pykmip server is listening on port 5696
    wait_for:
      host: 127.0.0.1
      port: 5696
      state: started
      timeout: 30
    register: kmip_port
    ignore_errors: true

  - name: read pykmip server log
    command: cat /pykmip_server.log
    register: pykmip_startup_log
    changed_when: false
    failed_when: false

  - name: read pykmip server stdout/stderr (crash traceback lands here)
    command: cat /pykmip_server.out
    register: pykmip_startup_out
    changed_when: false
    failed_when: false

  - name: print pykmip server status
    debug:
      msg:
        - "pykmip process: {{ pykmip_status.stdout_lines | default(['<not running>']) }}"
        - "port 5696 reachable: {{ (kmip_port is succeeded) | ternary('yes', 'no') }}"
        - "pykmip stdout/stderr:"
        - "{{ pykmip_startup_out.stdout_lines | default([]) }}"
        - "pykmip log:"
        - "{{ pykmip_startup_log.stdout_lines | default([]) }}"

  - name: copy the global manifest for mysql
    copy:
        src: /package-testing/kmip/mysqld.my
        dest: /usr/sbin/
        remote_src: yes

  - name: copy the global configuration file for mysql in Redhat/CentOS
    copy:
        src: /package-testing/kmip/component_keyring_kmip.cnf
        dest: /usr/lib64/mysql/plugin/
        remote_src: yes
    when: ansible_os_family == "RedHat"

  - name: copy the global configuration file for mysql in Debian/Ubuntu
    copy:
        src: /package-testing/kmip/component_keyring_kmip.cnf
        dest: /usr/lib/mysql/plugin/
        remote_src: yes
    when: ansible_os_family == "Debian"

  # Use the encryption config WITHOUT innodb-sys-tablespace-encrypt: this test
  # enables encryption on an already-initialized datadir (no re-init), and that
  # one option can only be set at bootstrap, otherwise mysqld aborts with
  # MY-011825. See kmip/encryption_no_sys_tablespace.j2 for details.
  - name: copy the encryption config file on Debian/Ubuntu
    copy:
        src: /package-testing/kmip/encryption_no_sys_tablespace.j2
        dest: /etc/mysql/conf.d/encryption.cnf
        remote_src: yes
    when: ansible_os_family == "Debian"

  - name: append include for RedHat
    lineinfile:
        path: /etc/my.cnf
        line: '!includedir /etc/my.cnf.d'
    when: ansible_os_family == "RedHat"

  - name: copy the encryption config file on RHEL/CentOS/Amazon
    copy:
        src: /package-testing/kmip/encryption_no_sys_tablespace.j2
        dest: /etc/my.cnf.d/encryption.cnf
        remote_src: yes
    when: ansible_os_family == "RedHat"

  # Observation: mysqld loads the KMIP keyring component at startup and aborts if
  # it cannot fetch the master key, but systemd only reports a generic failure.
  # On failure, dump the real cause (mysqld error log + journal) and re-check
  # that pykmip is still listening, then re-fail.
  - name: start mysql and capture diagnostics on failure
    block:
      - name: start mysql service debian
        service: name=mysql state=started
        when: ansible_os_family == "Debian"

      - name: start mysql service rhel
        service: name=mysqld state=started
        when: ansible_os_family == "RedHat"
    rescue:
      - name: re-check pykmip process after mysqld start attempt
        shell: pgrep -af pykmip-server
        register: kmip_recheck
        changed_when: false
        failed_when: false

      - name: re-check pykmip port 5696 after mysqld start attempt
        wait_for:
          host: 127.0.0.1
          port: 5696
          state: started
          timeout: 5
        register: kmip_port_recheck
        ignore_errors: true

      - name: read mysqld error log (any distro)
        shell: >
          for f in /var/log/mysqld.log /var/log/mysql/error.log /var/log/mysqld.err; do
            if [ -f "$f" ]; then echo "== $f =="; cat "$f"; fi
          done
        register: mysql_err
        changed_when: false
        failed_when: false

      - name: read journal for mysql service (any distro)
        shell: journalctl -xe --no-pager -u mysqld.service -u mysql.service | tail -n 150
        register: mysql_journal
        changed_when: false
        failed_when: false

      - name: print mysqld failure diagnostics
        debug:
          msg:
            - "pykmip still running: {{ kmip_recheck.stdout_lines | default(['<not running>']) }}"
            - "pykmip port 5696 reachable: {{ (kmip_port_recheck is succeeded) | ternary('yes', 'no') }}"
            - "mysqld error.log:"
            - "{{ mysql_err.stdout_lines | default([]) }}"
            - "journalctl mysql.service:"
            - "{{ mysql_journal.stdout_lines | default([]) }}"

      - name: fail after dumping mysqld diagnostics
        fail:
          msg: "mysqld failed to start - see the diagnostics printed above for the cause."

  - name: check mysql service status
    command: /package-testing/check_running.sh mysql running

  - name: set root password on centos
    command: /package-testing/setpass_57.sh
    when: ansible_os_family == "RedHat"

  - name: import world database
    command: /package-testing/plugins_test.sh

  - name: Enable PXB 97 repo
    command: percona-release enable-only pxb-97-lts testing

  - name: install Percona XtraBackup 97 packages
    include_tasks: ../tasks/install_pxb97.yml

  - name: check that Percona XtraBackup version is correct
    command: /package-testing/version_check.sh pxb97

  - name: check that Percona XtraBackup package versions are correct
    command: /package-testing/package_check.sh pxb97

  - name: run backup
    command: /usr/bin/xtrabackup --backup --user=root --target-dir=/tmp/backups/

  - name: prepare backup on Redhat/CentOS
    command: /usr/bin/xtrabackup --prepare --user=root --target-dir=/tmp/backups/ --component-keyring-config=/usr/lib64/mysql/plugin/component_keyring_kmip.cnf
    when: ansible_os_family == "RedHat"

  - name: prepare backup on Debian/Ubuntu
    command: /usr/bin/xtrabackup --prepare --user=root --target-dir=/tmp/backups/ --component-keyring-config=/usr/lib/mysql/plugin/component_keyring_kmip.cnf
    when: ansible_os_family == "Debian"

  - name: check that the pykmip server process is running
    shell: pgrep -af pykmip-server
    register: pykmip_proc
    changed_when: false
    failed_when: pykmip_proc.rc != 0

  - name: print pykmip server process
    debug:
      var: pykmip_proc.stdout_lines

  - name: read pykmip server log
    command: cat /pykmip_server.log
    register: pykmip_log
    changed_when: false

  - name: print pykmip server log
    debug:
      var: pykmip_log.stdout_lines
