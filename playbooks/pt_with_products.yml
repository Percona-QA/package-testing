---
# Percona Toolkit "with other products" test — single, dynamic playbook.
#
# One product is selected at run time via the `install_with` env var. The playbook
# installs & starts that product by REUSING the existing
# ../tasks/install_and_run_<product>.yml task (no per-product logic is duplicated
# here), then installs Percona Toolkit, verifies every pt tool reports the version
# defined in VERSIONS, and runs the pt tool relevant to that product.
#
# Supported install_with values (each has a ../tasks/install_and_run_<product>.yml task):
#   ps57 ps80 ps84 | pxc57 pxc80 | upstream57 upstream80 | psmdb44 psmdb50 psmdb60
#
# To support a new product, add its ../tasks/install_and_run_<product>.yml task
# and, only if it is a new product family, extend `pt_tool` below. This playbook
# needs no other change — product selection and task execution are dynamic.

- hosts: all
  become: true
  become_method: sudo
  vars:
    install_with: "{{ lookup('env', 'install_with') }}"
    install_repo: "{{ lookup('env', 'install_repo') }}"
    gnupg_home: /root/.gnupg
    percona_key1: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    percona_key1_file: "{{ gnupg_home }}/PERCONA-PACKAGING-KEY"
    # All psmdb versions share one task file (it keys off install_with internally);
    # every other product maps to its own task file by name.
    product_task: "{{ 'psmdb' if install_with is match('psmdb') else install_with }}"
    # pt tool to exercise, chosen by product family.
    pt_tool: "{{ 'pt-mongodb-summary' if install_with is match('psmdb') else 'pt-mysql-summary' }}"
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  tasks:
  - name: include tasks for test env setup
    include_tasks: ../tasks/test_prep.yml

  - name: fail early when install_with is not set
    fail:
      msg: >-
        install_with env var is not set. Expected one of:
        ps57, ps80, ps84, pxc57, pxc80, upstream57, upstream80, psmdb44, psmdb50, psmdb60
    when: install_with | length == 0

# Dynamic product selection: install and start the chosen product by reusing its
# existing install_and_run task.
  - name: "install and start selected product: {{ install_with }}"
    include_tasks: "../tasks/install_and_run_{{ product_task }}.yml"

# Enable only the pt repo and install Percona Toolkit.
  - name: include tasks for enabling pt testing repo
    include_tasks: ../tasks/enable_only_repo_for_pt.yml
    vars:
      repo_name: pt
      repo_type: testing
    when: install_repo == "testing" or install_repo == ""

  - name: include tasks for enabling pt main repo
    include_tasks: ../tasks/enable_only_repo_for_pt.yml
    vars:
      repo_name: pt
      repo_type: release
    when: install_repo == "main"

  - name: include tasks for enabling pt experimental repo
    include_tasks: ../tasks/enable_only_repo_for_pt.yml
    vars:
      repo_name: pt
      repo_type: experimental
    when: install_repo == "experimental"

  - name: include tasks for pt installation
    include_tasks: ../tasks/install_pt.yml

# Verify every pt tool reports the version defined in VERSIONS (binary + package).
  - name: check that pt version is correct
    command: ../version_check.sh pt
    register: pt_version_check

  - name: show pt version check output
    debug:
      var: pt_version_check.stdout_lines

# Exercise the pt tool relevant to the selected product.
  - name: "run {{ pt_tool }}"
    command: "{{ pt_tool }}"

  - name: remove pt packages
    include_tasks: ../tasks/remove_pt.yml
