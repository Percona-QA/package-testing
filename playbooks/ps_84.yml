---
# This playbook does following:
#   enables Percona testing repository
#   installs latest version of PS 8.4, PT and PXB 8.4
#   does some tests

# Cosmic is still missing python
# import_playbook: test_prep.yml

- hosts: all
  become: true
  become_method: sudo
  vars:
    install_mysql_shell: "{{ lookup('env', 'install_mysql_shell', default='') }}"
    gnupg_home: /root/.gnupg
    percona_key1: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    percona_key1_file: "{{ gnupg_home }}/PERCONA-PACKAGING-KEY"
  environment:
    install_mysql_shell: '{{ install_mysql_shell }}'
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  tasks:
  - set_fact:
      pro: "{{ 'pro' if 'yes' in lookup('env', 'pro_test') else '' }}"

  - name: include tasks for test env setup
    include_tasks: ../tasks/test_prep.yml

  - name: include tasks for local vault setup
    include_tasks: ../tasks/setup_local_vault.yml

  - name: setup config file for keyring vault
    template: src=../scripts/ps_keyring_plugins_test/keyring_vault_test_v2.j2
              dest=/package-testing/scripts/ps_keyring_plugins_test/keyring_vault_test.cnf
              mode=0664 owner=root group=root

  - name: enforce SELinux on CentOS
    selinux:
      policy: targeted
      state: enforcing
    when: ansible_os_family == "RedHat"

  - name: get selinux status
    command: sestatus
    register: selinux_status
    when: ansible_os_family == "RedHat"

  - name: list selinux status
    debug:
      var: selinux_status
    when: ansible_os_family == "RedHat"

  - name: include tasks for enabling PS 84 main repo
    include_tasks: ../tasks/enable_ps84_main_repo.yml
    when:
      - lookup('env', 'install_repo') == "main"
      - lookup('env', 'pro_test') != "yes"

  - name: include tasks for enabling PS 84 test repo
    include_tasks: ../tasks/enable_ps84_testing_repo.yml
    when:
      - lookup('env', 'install_repo') == "testing" or lookup('env', 'install_repo') == ""
      - lookup('env', 'pro_test') != "yes"

  - name: include tasks for enabling PS 84 experimental repo
    include_tasks: ../tasks/enable_ps84_experimental_repo.yml
    when:
      - lookup('env', 'install_repo') == "experimental"
      - lookup('env', 'pro_test') != "yes"

  - name: include tasks for enabling PS 84 pro repo
    include_tasks: ../tasks/enable_ps84_pro_tools_repo.yml
    when:
      - lookup('env', 'pro_test') == "yes"

  - name: download and extract world database
    command: "{{ item }}"
    with_items:
    - wget --no-check-certificate -P /package-testing https://raw.githubusercontent.com/Percona-QA/percona-qa/master/sample_db/world.sql

  - name: install Percona Server{{ pro_suf }} 8.4 packages
    include_tasks: ../tasks/install_ps84.yml
    vars:
      pro_suf: "{{ '-pro' if 'yes' in lookup('env', 'pro_test') else '' }}"

  - name: install percona-mysql-shell package
    include_tasks: ../tasks/install_pshell.yml
    when: 
      - install_mysql_shell == "yes" or install_mysql_shell == ""
      - ansible_distribution != "Amazon"
      - not (ansible_distribution == "Debian" and ansible_distribution_major_version|int == 11)

  - name: Check mysql-shell version and bundled certifi CA certificates
    when:
      - install_mysql_shell == "yes" or install_mysql_shell == ""
      - ansible_distribution != "Amazon"
      - not (ansible_distribution == "Debian" and ansible_distribution_major_version|int == 11)
    block:
      - name: Get mysql-shell version
        command: mysqlsh --version
        register: mysqlsh_version
        changed_when: false

      - name: Display mysql-shell version
        debug:
          msg: "{{ mysqlsh_version.stdout }}"

      - name: Locate certifi cacert.pem bundled with mysql-shell
        shell: ls /usr/lib/mysqlsh/lib/python3*/site-packages/certifi/cacert.pem /usr/lib64/mysqlsh/lib/python3*/site-packages/certifi/cacert.pem 2>/dev/null | head -n1
        register: mysqlsh_cacert
        changed_when: false
        failed_when: mysqlsh_cacert.stdout == ""

      - name: Search for eMudhra (emSign) and Comodo AAA certificates
        shell: grep -nE "emSign|AAA Certificate Services|Comodo AAA" {{ mysqlsh_cacert.stdout }}
        register: mysqlsh_cert_grep
        changed_when: false
        failed_when: mysqlsh_cert_grep.rc > 1

      - name: Display matching certificates
        debug:
          var: mysqlsh_cert_grep.stdout_lines

      - name: Verify only one eMudhra trust certificate is present
        assert:
          that:
            - mysqlsh_cert_grep.stdout_lines | select('search', '# Label:.*emSign') | list | length == 1
            - mysqlsh_cert_grep.stdout_lines | select('search', 'AAA Certificate Services|Comodo AAA') | list | length == 0
          fail_msg: "Expected exactly one eMudhra (emSign) certificate and no Comodo AAA certificate in {{ mysqlsh_cacert.stdout }}"
          success_msg: "Only one eMudhra trust certificate found: {{ mysqlsh_cert_grep.stdout_lines | select('search', '# Label:') | list }}"

  - name: list installed packages
    include_tasks: ../tasks/list_installed_packages.yml

  - name: start mysql service with service command
    command: service mysql start
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "6"

  - name: start mysql service with systemctl command
    command: systemctl start mysql
    when: (ansible_distribution == "Amazon") or (ansible_os_family == "RedHat" and ansible_distribution_major_version|int >= 7)

  - name: set root password on centos
    command: /package-testing/setpass_57.sh
    when: ansible_os_family == "RedHat"

  - name: disable selinux on centos7 for TokuDB to work
    shell: setenforce 0 || true
    when: ansible_os_family == "RedHat"

  - name: append include for RedHat
    lineinfile:
        path: /etc/my.cnf
        line: '!includedir /etc/my.cnf.d'
    when: ansible_os_family == "RedHat"

  
