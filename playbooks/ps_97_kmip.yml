---
# This playbook does the following:
#   enables Percona testing repository
#   installs latest version of PS 9.7, PyKmip and runs some tests

- hosts: all
  become: true
  become_method: sudo
  vars:
    gnupg_home: /root/.gnupg
    percona_key1: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    percona_key1_file: "{{ gnupg_home }}/PERCONA-PACKAGING-KEY"
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  tasks:
  - name: include tasks for test env setup
    include_tasks: ../tasks/test_prep.yml

  - name: disable selinux
    selinux: state=disabled
    when: ansible_os_family == "RedHat"

  - name: include tasks for enabling PS 97 test repo
    include_tasks: ../tasks/enable_ps97_main_repo.yml
    when: lookup('env', 'install_repo') == "main"

  - name: include tasks for enabling PS 97 test repo
    include_tasks: ../tasks/enable_ps97_testing_repo.yml
    when: lookup('env', 'install_repo') == "testing" or lookup('env', 'install_repo') == ""

  - name: include tasks for enabling PS 97 experimental repo
    include_tasks: ../tasks/enable_ps97_experimental_repo.yml
    when: lookup('env', 'install_repo') == "experimental"

  - name: download and extract world database
    command: "{{ item }}"
    with_items:
    - wget --no-check-certificate -P /package-testing https://raw.githubusercontent.com/Percona-QA/percona-qa/master/sample_db/world.sql

  - name: install Percona Server 9.7 packages
    include_tasks: ../tasks/install_ps97.yml

  - name: list installed packages
    include_tasks: ../tasks/list_installed_packages.yml

  - name: stop mysql service
    service: name=mysql state=stopped

  - name: remove mysql data directory
    command: rm -r /var/lib/mysql

  - name: install python3-pip on RedHat
    dnf:
      name:
      - python3-pip
      state: latest
      update_cache: yes
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon", "Rocky"]

  - name: install python3-pip on Debian/Ubuntu
    apt:
      name:
      - python3-pip
      state: latest
      update_cache: yes
    when: ansible_os_family == "Debian"

  - name: install pykmip
    command: "{{ item }}"
    with_items:
        - python3 -m pip install --upgrade importlib-metadata
        - python3 -m pip install -U pip --ignore-installed
        - python3 -m pip install --upgrade --ignore-installed setuptools
        - python3 -m pip install --ignore-installed urllib3==1.26.6
        - python3 -m pip install -U pykmip
    when:
      - ansible_distribution_release not in ['bookworm', 'noble', 'trixie', 'resolute']

#  - name: install pykmip
#    command: "{{ item }}"
#    with_items:
#        - python3 -m pip install -U --break-system-packages pip
#        - python3 -m pip install -U --break-system-packages setuptools
#        - python3 -m pip install -U --break-system-packages pykmip
#    when: ansible_distribution_release in ["bookworm", "noble"]

  - name: Ensure ~/.local/bin is in PATH for current user
    lineinfile:
      path: /home/{{ ansible_user }}/.bashrc
      line: 'export PATH=$HOME/.local/bin:$PATH'
      insertafter: EOF
    when:
      - ansible_distribution_release in ['bookworm', 'noble', 'trixie', 'resolute']

  - name: install pykmip on bookworm/noble using user site
    pip:
      name:
        - setuptools
        - pykmip
      extra_args: "--user --break-system-packages"
      executable: pip3
    environment:
      PYTHONUSERBASE: "/home/{{ ansible_user }}/.local"
    when:
      - ansible_distribution_release in ['bookworm', 'noble', 'trixie', 'resolute']

  - name: downgrade SQLAlchemy as new version doesn't work with pykmip
    command: pip3 install SQLAlchemy==1.4.46
    when:
      - ansible_distribution_release not in ['bookworm', 'noble', 'trixie', 'resolute']

  - name: downgrade SQLAlchemy as new version doesn't work with pykmip
    command: pip3 install --break-system-packages SQLAlchemy==1.4.46
    when: ansible_distribution_release in ['bookworm', 'noble', 'trixie', 'resolute']

#  - name: Check PyKMIP is importable
#    command: python3 -c "import pykmip; print(pykmip.__version__)"
#    register: pykmip_check
#    failed_when: "'No module named' in pykmip_check.stderr"
#    when:
#      - ansible_distribution_release in ['bookworm', 'noble', 'trixie', 'resolute']

  - name: set the pykmip server binary path
    set_fact:
      pykmip_bin: "{{ (ansible_distribution_release in ['bookworm', 'noble', 'trixie', 'resolute']) | ternary('/home/' + ansible_user + '/.local/bin/pykmip-server', '/usr/local/bin/pykmip-server') }}"

  # Start pykmip under a transient systemd unit instead of `nohup ... &`. A
  # backgrounded shell process is a child of the Ansible SSH session, and on
  # some distros systemd-logind tears down the session's cgroup scope when
  # the task's connection ends, killing the server before mysqld starts.
  # nohup only ignores SIGHUP, it does not detach from that scope.
  # systemd-run places pykmip in its own unit that outlives the SSH session
  # (see pxb_97_kmip.yml, where this exact pattern already works).
  - name: remove any stale pykmip-server transient unit from a previous run
    command: systemctl reset-failed pykmip-server.service
    failed_when: false
    changed_when: false

  - name: stop any stale pykmip-server transient unit from a previous run
    command: systemctl stop pykmip-server.service
    failed_when: false
    changed_when: false

  - name: start pykmip server
    command: >
      systemd-run --unit=pykmip-server --collect
      --property=StandardOutput=file:/pykmip_server.out
      --property=StandardError=file:/pykmip_server.out
      {{ pykmip_bin }}
      -f /package-testing/kmip/server.conf -l /pykmip_server.log

  - name: wait a few seconds for pykmip server to come up
    pause:
      seconds: 5

  - name: check pykmip server process is running
    shell: pgrep -af pykmip-server
    register: kmip_status
    changed_when: false
    failed_when: false

  - name: check pykmip server is listening on port 5696
    wait_for:
      host: 127.0.0.1
      port: 5696
      state: started
      timeout: 30
    register: kmip_port
    ignore_errors: true

  - name: read pykmip server log
    command: cat /pykmip_server.log
    register: pykmip_startup_log
    changed_when: false
    failed_when: false

  - name: read pykmip server stdout/stderr (crash traceback lands here)
    command: cat /pykmip_server.out
    register: pykmip_startup_out
    changed_when: false
    failed_when: false

  - debug:
      msg:
        - "pykmip process: {{ kmip_status.stdout_lines | default(['<not running>']) }}"
        - "port 5696 reachable: {{ (kmip_port is succeeded) | ternary('yes', 'no') }}"
        - "pykmip stdout/stderr:"
        - "{{ pykmip_startup_out.stdout_lines | default([]) }}"
        - "pykmip log:"
        - "{{ pykmip_startup_log.stdout_lines | default([]) }}"

  - name: copy the global manifest for mysql
    copy:
        src: /package-testing/kmip/mysqld.my
        dest: /usr/sbin/
        remote_src: yes

  - name: copy the global configuration file for mysql in Redhat/CentOS
    copy:
        src: /package-testing/kmip/component_keyring_kmip.cnf
        dest: /usr/lib64/mysql/plugin/
        remote_src: yes
    when: ansible_os_family == "RedHat"

  - name: copy the global configuration file for mysql in Debian/Ubuntu
    copy:
        src: /package-testing/kmip/component_keyring_kmip.cnf
        dest: /usr/lib/mysql/plugin/
        remote_src: yes
    when: ansible_os_family == "Debian"

  - name: copy the encryption config file on Debian/Ubuntu
    copy:
        src: /package-testing/kmip/encryption.j2
        dest: /etc/mysql/conf.d/encryption.cnf
        remote_src: yes
    when: ansible_os_family == "Debian"

  - name: append include for RedHat
    lineinfile:
        path: /etc/my.cnf
        line: '!includedir /etc/my.cnf.d'
    when: ansible_os_family == "RedHat"

  - name: copy the encryption config file on RHEL/CentOS/Amazon
    copy:
        src: /package-testing/kmip/encryption.j2
        dest: /etc/my.cnf.d/encryption.cnf
        remote_src: yes
    when: ansible_os_family == "RedHat"

  - name: Start MySQL and collect logs on failure
    block:
      - name: Start mysql service
        service:
          name: mysql
          state: started

      - name: Check mysql service status
        command: /package-testing/check_running.sh mysql running

    rescue:
      - name: Show systemctl status
        command: systemctl status mysql --no-pager -l
        register: mysql_status
        ignore_errors: yes

      - debug:
          var: mysql_status.stdout_lines

      - name: Show last 200 journal logs
        command: journalctl -u mysql --no-pager -n 200
        register: mysql_journal
        ignore_errors: yes

      - debug:
          var: mysql_journal.stdout_lines

      - name: Show MySQL error log
        shell: |
          if [ -f /var/log/mysql/error.log ]; then
            cat /var/log/mysql/error.log
          elif [ -f /var/log/mysqld.log ]; then
            cat /var/log/mysqld.log
          elif [ -f /var/log/mysqld.err ]; then
            cat /var/log/mysqld.err
          fi
        register: mysql_errorlog
        ignore_errors: yes

      - debug:
          var: mysql_errorlog.stdout_lines

      - fail:
          msg: "MySQL failed to start. See logs above."

  - name: check mysql service status
    command: /package-testing/check_running.sh mysql running

  - name: set root password on centos
    command: /package-testing/setpass_57.sh
    when: ansible_os_family == "RedHat"

  - name: check that Percona Server package versions are correct
    command: /package-testing/package_check.sh ps97

  - name: import world database
    command: /package-testing/plugins_test.sh
