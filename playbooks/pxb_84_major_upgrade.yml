---
# This playbook does following (major upgrade path):
#   installs PS 8.0 from main (release) repo
#   installs PXB 8.0 from main (release) repo
#   runs some tests / backup
#   removes PXB 8.0
#   enables PS 8.4 main (release) or testing repo, based on install_repo env var, upgrades PS to 8.4
#   enables PXB 8.4 main (release) or testing repo, based on install_repo env var
#   installs PXB 8.4 (major upgrade)
#   runs post-upgrade tests / backup
#

- hosts: all
  become: true
  become_method: sudo
  vars:
    gnupg_home: /root/.gnupg
    percona_key1: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    percona_key1_file: "{{ gnupg_home }}/PERCONA-PACKAGING-KEY"
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  tasks:
  - name: include tasks for test env setup
    include_tasks: ../tasks/test_prep.yml

  - name: download and extract world database
    command: "{{ item }}"
    with_items:
    - wget --no-check-certificate -P /package-testing https://raw.githubusercontent.com/Percona-QA/percona-qa/master/sample_db/world.sql

# ---------- INSTALL PS 8.0 ----------

  - name: disable the mysql module on RHEL/CentOS 8
    command: /usr/bin/dnf module disable mysql -y
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

  - name: install percona-release package
    include_tasks: ../tasks/install_percona-release.yml

  - name: enable the PS-80 release repo
    command: percona-release enable ps-80 release

  - name: Clean and update package cache
    shell: |
      {{ ansible_pkg_mgr }} clean all
      {{ ansible_pkg_mgr }} makecache
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon", "Rocky"]

  - name: install Percona Server 8.0 packages
    include_tasks:
      file: ../tasks/install_ps80.yml
      apply:
        environment:
          PERCONA_TELEMETRY_DISABLE: "1"
    when:
      - lookup('env', 'server_to_test') == "ps-84"

  - name: Install percona release if ms-84 is selected
    include_tasks: ../tasks/install_percona-release.yml
    when:
      - lookup('env', 'server_to_test') == "ms-84"

# ---------- INSTALL MS 8.0 (release) ----------

  - name: Extract PXB80 major and minor version number using shell commands
    shell: cat /package-testing/VERSIONS | grep 'PXB80_VER' | cut -d'=' -f2 | sed 's/"//g'
    register: pxb80_version_major_minor_register

  - name: Extract PXB80 major version number using shell commands
    shell: cat /package-testing/VERSIONS | grep PXB80_VER | awk -F'[=".]' '{print $3"."$4}'
    register: pxb80_version_major_register

  - name: Set pxb80_version_major variable
    set_fact:
      pxb80_version_major_reg: "{{ pxb80_version_major_register.stdout }}"

  - name: Set pxb80_version_major_minor variable
    set_fact:
      pxb80_version_major_minor_reg: "{{ pxb80_version_major_minor_register.stdout }}"

  - name: install MYSQL MS Server 8.0 packages
    include_tasks: ../tasks/install_ms_innovation.yml
    vars:
      pxb_version_major: "{{ pxb80_version_major_reg }}"
      pxb_version_major_minor: "{{ pxb80_version_major_minor_reg }}"
    when:
      - lookup('env', 'server_to_test') == "ms-84"

# ---------- INSTALL PXB 8.0 ----------

  - name: install percona-release package
    include_tasks: ../tasks/install_percona-release.yml

  - name: Enable PXB 80 repo main non pro
    command: percona-release enable-only pxb-80 release

  - name: install Percona XtraBackup 8.0 packages
    include_tasks:
      file: ../tasks/install_pxb80.yml
      apply:
        environment:
          PERCONA_TELEMETRY_DISABLE: "1"

# ---------- START MYSQL, RUN TESTS BEFORE UPGRADE ----------

  - name: Print the version of the installed Percona XtraBackup BEFORE UPGRADE
    shell: |
      {
        echo "XTRABACKUP VERSION is ";
        xtrabackup --version || echo "FAILED: xtrabackup --version";
        echo "xbstream VERSION is ";
        xbstream --version || echo "FAILED: xbstream --version";
        echo "xbcloud VERSION is ";
        xbcloud --version || echo "FAILED: xbcloud --version";
        echo "xbcrypt VERSION is ";
        xbcrypt --version || echo "FAILED: xbcrypt --version";
        echo "list rpm packages ";
        rpm -qa | grep "percona" || echo "FAILED: rpm -qa | grep percona";
        echo "list deb packages";
        dpkg -l | grep "percona" || echo "FAILED: dpkg -l | grep percona";
      }
    register: version_output
    ignore_errors: yes

  - name: Display version information BEFORE UPGRADE
    debug:
      var: version_output.stdout_lines

  - name: check that Percona XtraBackup 8.0 version is correct
    command: /package-testing/version_check.sh pxb80

  - name: start mysql service with systemctl command
    command: systemctl start mysqld
    when: ansible_os_family == "RedHat"

  - name: set root password on centos
    command: /package-testing/setpass_57.sh
    when: ansible_os_family == "RedHat"

  - name: copy .my.cnf with credentials on centos
    template: src=../templates/my_57.j2
              dest=/root/.my.cnf
              mode=0640 owner=root group=root
    when: ansible_os_family == "RedHat"

  - name: restart mysql service
    service: name=mysqld state=restarted
    when: ansible_os_family == "RedHat"

  - name: restart mysql service debian
    service: name=mysql state=restarted
    when: ansible_os_family == "Debian"

  - name: install plugins, import world database
    command: /package-testing/plugins_test.sh

  - name: run backup with PXB 8.0
    command: /usr/bin/xtrabackup --backup --user=root --target-dir=/tmp/backups_80/

  - name: prepare backup with PXB 8.0
    command: /usr/bin/xtrabackup --prepare --user=root --target-dir=/tmp/backups_80/

# ---------- MAJOR UPGRADE: REMOVE PXB 8.0, UPGRADE PS TO 8.4, INSTALL PXB 8.4 ----------

  - name: remove PXB 8.0 packages before major upgrade
    include_tasks: ../tasks/remove_pxb80.yml

  - name: disable all percona repos
    command: percona-release disable all

  - name: include tasks for enabling PS 84 main (release) repo
    include_tasks: ../tasks/enable_ps84_main_repo.yml
    when:
      - lookup('env', 'install_repo') == "main"

  - name: include tasks for enabling PS 84 Testing repo
    include_tasks: ../tasks/enable_ps84_testing_repo.yml
    when:
      - lookup('env', 'install_repo') == "testing" or lookup('env', 'install_repo') == ""

  - name: install Percona Server 8.4 packages (upgrade PS 8.0 -> 8.4)
    include_tasks:
      file: ../tasks/install_ps84.yml
      apply:
        environment:
          PERCONA_TELEMETRY_DISABLE: "1"
    when:
      - lookup('env', 'server_to_test') == "ps-84"

  - name: Extract PS84 major and minor version number using shell commands
    shell: cat /package-testing/VERSIONS | grep 'PS84_VER' | cut -d'=' -f2 | sed 's/"//g' | cut -d'-' -f1
    register: ps84_version_major_minor_register

  - name: Extract PS84 major version number using shell commands
    shell: cat /package-testing/VERSIONS | grep PS84_VER | awk -F'[=".]' '{print $3"."$4}'
    register: ps84_version_major_register

  - name: Set ps84_version_major variable
    set_fact:
      ps84_version_major_reg: "{{ ps84_version_major_register.stdout }}"

  - name: Set ps84_version_major_minor variable
    set_fact:
      ps84_version_major_minor_reg: "{{ ps84_version_major_minor_register.stdout }}"

  - name: install MYSQL MS Server 8.4 packages (upgrade MS 8.0 -> 8.4)
    include_tasks: ../tasks/install_ms_innovation.yml
    vars:
      pxb_version_major: "{{ ps84_version_major_reg }}"
      pxb_version_major_minor: "{{ ps84_version_major_minor_reg }}"
    when:
      - lookup('env', 'server_to_test') == "ms-84"

# ---------- INSTALL PXB 8.4 (major upgrade) ----------

  - name: Enable PXB 8.4 release repo
    command: percona-release enable pxb-84-lts release
    when:
      - lookup('env', 'install_repo') == "main"

  - name: Enable PXB 8.4 testing repo
    command: percona-release enable-only pxb-84-lts testing
    when:
      - lookup('env', 'install_repo') == "testing" or lookup('env', 'install_repo') == ""

  - name: install Percona XtraBackup 8.4 packages (major upgrade to 8.4)
    include_tasks:
      file: ../tasks/install_pxb84.yml
      apply:
        environment:
          PERCONA_TELEMETRY_DISABLE: "1"

# ---------- POST-UPGRADE CHECKS ----------

  - name: Print the version of the installed Percona XtraBackup AFTER UPGRADE
    shell: |
      {
        echo "XTRABACKUP VERSION is ";
        xtrabackup --version || echo "FAILED: xtrabackup --version";
        echo "xbstream VERSION is ";
        xbstream --version || echo "FAILED: xbstream --version";
        echo "xbcloud VERSION is ";
        xbcloud --version || echo "FAILED: xbcloud --version";
        echo "xbcrypt VERSION is ";
        xbcrypt --version || echo "FAILED: xbcrypt --version";
        echo "list rpm packages ";
        rpm -qa | grep "percona" || echo "FAILED: rpm -qa | grep percona";
        echo "list deb packages";
        dpkg -l | grep "percona" || echo "FAILED: dpkg -l | grep percona";
      }
    register: version_output
    ignore_errors: yes

  - name: Display version information AFTER UPGRADE
    debug:
      var: version_output.stdout_lines

  - name: start mysql service after PS upgrade RHEL
    command: systemctl start mysqld
    when: ansible_os_family == "RedHat"
    ignore_errors: yes

  - name: start mysql service after PS upgrade Debian
    service: name=mysql state=started
    when: ansible_os_family == "Debian"
    ignore_errors: yes

  - name: check that Percona XtraBackup 8.4 version is correct
    command: /package-testing/version_check.sh pxb84

  - name: check that Percona XtraBackup 8.4 package versions are correct
    command: /package-testing/package_check.sh pxb84

  - name: run backup with PXB 8.4
    command: /usr/bin/xtrabackup --backup --user=root --target-dir=/tmp/backups_84/

  - name: prepare backup with PXB 8.4
    command: /usr/bin/xtrabackup --prepare --user=root --target-dir=/tmp/backups_84/

# ---------- CLEANUP ----------

  - name: remove Percona Server deb packages
    apt:
      name: "{{ packages }}"
      update_cache: no
      state: absent
    vars:
      packages:
      - percona-server-server
      - percona-xtrabackup-84
    when:
      - ansible_os_family == "Debian"
      - lookup('env', 'server_to_test') != "ms-84"

  - name: remove Percona Server rpm packages
    dnf:
      name: "{{ packages }}"
      state: absent
    vars:
      packages:
      - percona-server-server
      - percona-xtrabackup-84
    when:
      - ansible_facts['distribution'] in ["RedHat", "CentOS", "OracleLinux", "Amazon", "Rocky"]
      - lookup('env', 'server_to_test') != "ms-84"
