---
# tasks file for pdpxc

- name: Check OpenSSL version
  command: openssl version
  register: openssl_version
  changed_when: false
  failed_when: false

- name: Show OpenSSL version
  debug:
    msg: "OpenSSL version on {{ inventory_hostname }}: {{ openssl_version.stdout }}"


- name: Update all dnf packages without reboot
  ansible.builtin.dnf: name='*' state=latest
  when: ansible_facts['distribution'] in ['RedHat','OracleLinux']

- name: include playbook for removing Percona repo
  include_tasks: ../../../tasks/remove_percona_repository.yml

- name: Install percona release
  include_tasks: ../../tasks/install_percona_release.yml

- set_fact:
    major_repo: "{{ lookup('env', 'MAJOR_REPO') }}"

- name: enable repo pdpxc-{{ version }}
  command: percona-release enable-only pdpxc-{{ version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'REPO') }}"
    version: "{{ lookup('env', 'VERSION').split('-')[0] }}"
  when: not major_repo

- name: enable repo pdpxc-{{ version }}
  command: percona-release enable-only pdpxc-{{ version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'REPO') }}"
    version: >-
      {{
        '97-lts' if '9.7' in lookup('env', 'VERSION')
        else '84-lts' if '8.4' in lookup('env', 'VERSION')
        else ''
      }}
  when: major_repo

- name: clean and update yum cache
  shell: |
    yum clean all
    yum makecache
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int < 8

- name: clean and update dnf cache
  shell: |
    dnf clean all
    dnf makecache
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int >= 8

- name: disable the mysql module on RHEL/CentOS 8 and 9 only
  command: dnf module disable mysql -y
  when:
    - ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon']
    - ansible_facts['distribution_major_version'] | int >= 8
    - ansible_facts['distribution_major_version'] | int <= 9

- name: disable the mariadb module on RHEL/CentOS 8 and 9 only
  command: dnf module disable mariadb -y
  when:
    - ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon']
    - ansible_facts['distribution_major_version'] | int >= 8
    - ansible_facts['distribution_major_version'] | int <= 9


- name: install PXC  deb packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
  vars:
    packages:
    - percona-xtradb-cluster-full
  when: ansible_os_family == "Debian"
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: install PXC rpm packages with yum
  yum:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-xtradb-cluster-full
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int < 8
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: install PXC rpm packages with dnf
  dnf:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-xtradb-cluster-full
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int == 8
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: install PXC rpm packages on RHEL 9+ with dnf
  dnf:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-xtradb-cluster-full
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int >= 9
  environment:
    PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: install percona-replication-manager RHEL Packages with yum
  yum:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-replication-manager
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int < 8

- name: install percona-replication-manager RHEL Packages with dnf
  dnf:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-replication-manager
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int >= 8

- name: install percona-replication-manager deb packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: latest
  vars:
    packages:
    - percona-replication-manager
  when: ansible_os_family == "Debian"

- name: install HA Proxy RHEL Packages with yum
  yum:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-haproxy
    - percona-haproxy-debuginfo
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int < 8

- name: install HA Proxy RHEL Packages with dnf
  dnf:
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
    - percona-haproxy
    - percona-haproxy-debuginfo
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int >= 8

- name: install HA Proxy deb packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
  vars:
    packages:
    - percona-haproxy
    - percona-haproxy-doc
    - percona-vim-haproxy
  when: ansible_os_family == "Debian" and ansible_distribution_release != "focal"

- name: clean dnf cache
  shell: |
    dnf clean all
  when: ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon'] and ansible_facts['distribution_major_version'] | int >= 8

- name: Install Percona XtraBackup packages
  include_tasks: ../../../tasks/install_pxb_innovation.yml
  vars:
    major_release_version: "{{ lookup('env', 'VERSION').split('.')[:2] | join('') }}"

- name: install Percona Toolkit packages
  include_tasks: ../../../tasks/install_pt.yml

- name: Set ProxySQL package name
  set_fact:
    proxysql_package: >-
      {{
        'proxysql3'
        if lookup('env', 'PROXYSQL_VERSION').startswith('3.')
        else 'proxysql2'
      }}

- name: Install ProxySQL deb package
  apt:
    name: "{{ proxysql_package }}"
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install ProxySQL rpm package with dnf
  dnf:
    name: "{{ proxysql_package }}"
    state: latest
    update_cache: yes
  when:
    - ansible_facts['distribution'] in ['RedHat','CentOS','OracleLinux','Amazon']
    - ansible_facts['distribution_major_version'] | int > 8

#install initscripts-service manually on OL9 till DISTMYSQL-300 is fixed
- name: install init scripts for OL9
  dnf:
    name: "{{ packages }}"
  vars:
    packages:
    - initscripts-service
  when: ansible_facts['distribution'] in ['OracleLinux'] and ansible_facts['distribution_major_version'] | int == 9

- name: start proxysql service
  command: service proxysql start

- name: stop proxysql service
  command: service proxysql stop

- name: start proxysql service
  command: service proxysql start

# set root password on centos
- name: start mysql service
  service: name=mysql state=started

- name: download package-testing repo with wget
  command: "{{ item }}"
  with_items:
  - rm -rf /package-testing
  - rm -f master.zip
  - wget --no-check-certificate -O master.zip "https://github.com/{{ git_account }}/package-testing/archive/{{ branch }}.zip"
  - unzip master.zip
  - rm -f master.zip
  - mv "package-testing-{{ branch }}" /package-testing
  vars:
    branch: "{{ lookup('env', 'TESTING_BRANCH') }}"
    git_account: "{{ lookup('env', 'TESTING_GIT_ACCOUNT') | default('Percona-QA', true) }}"

- name: install python3-pip for pytest with apt
  apt:
    name: python3-pip
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: install python3-pip for pytest with yum/dnf
  package:
    name: python3-pip
    state: present
  when: ansible_os_family == "RedHat"

# Use the pip module (idempotent). Try a plain install first and only fall
# back to --break-system-packages on externally-managed environments
# (Debian 12+/Ubuntu 24.04+); passing that flag unconditionally would break
# older pip (e.g. RHEL 8) that doesn't support it.
- name: install pytest via pip
  block:
    - name: install pytest
      pip:
        name: pytest
        executable: pip3
  rescue:
    - name: install pytest (externally-managed env)
      pip:
        name: pytest
        executable: pip3
        extra_args: --break-system-packages

- name: set root password on centos
  command: /package-testing/setpass_57.sh
  when: ansible_os_family == "RedHat"

- name: copy .my.cnf with credentials on centos
  template: src=../../../../templates/my_57.j2
            dest=/root/.my.cnf
            mode=0640 owner=root group=root
  when: ansible_os_family == "RedHat"

- name: run pytest tests for mysql init scripts
  command: python3 -m pytest -v /package-testing/pytest-tests/test_pxc_init_scripts.py

- name: start mysql service
  service: name=mysql state=started
  when: ansible_os_family == "Debian"

- name: Verify telemetry version and package installation
  command: /package-testing/check_tel_ver_pack.sh
  when: ansible_distribution_release != "focal"
