---
- name: Prepare node for running pxc-qa suites
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true
  vars:
    qa_user: pxcqa
    qa_home: /home/pxcqa
    qa_venv: /opt/pxc-qa-venv
  tasks:

    - name: Setup SSH keys for Oracle Linux or Amazon
      authorized_key:
        user: ec2-user
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_os_family == "RedHat"

    - name: Setup SSH keys Debian
      authorized_key:
        user: admin
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Debian"

    - name: Setup SSH keys Ubuntu
      authorized_key:
        user: ubuntu
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Ubuntu"

    # mysqld refuses to start as root and pxc-qa does not pass --user,
    # so the whole framework runs as this unprivileged user.
    - name: Create {{ qa_user }} user for running pxc-qa (non-root)
      ansible.builtin.user:
        name: "{{ qa_user }}"
        comment: "pxc-qa test user"
        home: "{{ qa_home }}"
        create_home: true
        shell: /bin/bash
        state: present

    - name: Install packages for Debian family
      apt:
        name:
          - git
          - tar
          - python3
          - python3-pip
          - python3-venv
          - libaio1
          - libnuma1
          - libatomic1
          - libev4
          - socat
          - rsync
          - lsof
          - openssl
          - gawk
          - procps
          - psmisc
          - cmake
          - make
          - gcc
          - g++
          - libssl-dev
          - zlib1g-dev
          # pstress links ssl, crypto, z and zstd (cmake/PQSetupCompiler.cmake)
          - libzstd-dev
          - sysbench
          # randgen (gendata.pl): DBI + DBD::mysql; GDBM_File comes with perl (libperl5.x)
          - perl
          - libdbi-perl
          - libdbd-mysql-perl
        update_cache: yes
        state: present
      when: ansible_os_family == "Debian"

    # EPEL provides libev (needed by the bundled xtrabackup) and sysbench. Oracle's own
    # EPEL mirror (oracle-epel-release-el9) has sysbench but not libev, so Fedora EPEL.
    # It is fetched through the download.fedoraproject.org mirror redirector because the
    # direct host dl.fedoraproject.org intermittently returns 404. The epel-release rpm
    # ships the EPEL GPG key itself (its repo file points at the local copy), so there
    # is no separate key download; the rpm is fetched over HTTPS from Fedora.
    - name: Setup EPEL repo (RedHat family)
      dnf:
        name: "https://download.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      register: epel_release
      retries: 5
      delay: 15
      until: epel_release is succeeded
      when: ansible_os_family == "RedHat"

    - name: Import EPEL GPG key from the epel-release package (RedHat family)
      rpm_key:
        state: present
        key: "/etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
      when: ansible_os_family == "RedHat"

    - name: Install packages for RedHat family
      dnf:
        name:
          - git
          - tar
          - python3
          - python3-pip
          - libaio
          - numactl-libs
          # libcrypt.so.1 for the PXC 5.7 (glibc2.17) tarball
          - libxcrypt-compat
          - libatomic
          - libev
          - socat
          - rsync
          - lsof
          - openssl
          - gawk
          - procps-ng
          - psmisc
          - cmake
          - make
          - gcc
          - gcc-c++
          - zlib-devel
          # pstress links ssl, crypto, z and zstd (cmake/PQSetupCompiler.cmake);
          # openssl-devel is installed below, pinned to the running openssl-libs
          - libzstd-devel
          - sysbench
          # randgen (gendata.pl): DBI + DBD::mysql, and GDBM_File is a separate rpm here
          - perl
          - perl-DBI
          - perl-DBD-MySQL
          - perl-GDBM_File
        state: present
      when: ansible_os_family == "RedHat"

    # Pin openssl-devel to the installed openssl-libs version. A plain install can
    # upgrade openssl-libs underneath the running sshd on older OL9 AMIs and make the
    # host unreachable mid-run (same workaround as molecule/pxb-new-ps-*).
    - name: Gather installed package facts (RedHat)
      ansible.builtin.package_facts:
        manager: rpm
      when: ansible_os_family == "RedHat"

    - name: Install openssl-devel pinned to installed openssl-libs version (RedHat)
      ansible.builtin.dnf:
        name: "openssl-devel-{{ ansible_facts.packages['openssl-libs'][0].version }}-{{ ansible_facts.packages['openssl-libs'][0].release }}"
        state: present
        allow_downgrade: true
      when:
        - ansible_os_family == "RedHat"
        - "'openssl-libs' in ansible_facts.packages"

    - name: Install percona-release for Debian family
      apt:
        deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
      when: ansible_os_family == "Debian"

    - name: Install percona-release for RedHat family
      command: dnf -y install https://repo.percona.com/yum/percona-release-latest.noarch.rpm
      args:
        creates: /usr/bin/percona-release
      when: ansible_os_family == "RedHat"

    - name: Enable Percona Toolkit repository
      command: percona-release enable pt
      changed_when: false

    # pxc-qa config.ini gets pt_basedir = /usr, i.e. /usr/bin/pt-table-checksum
    - name: Install Percona Toolkit
      package:
        name: percona-toolkit
        state: latest
        update_cache: "{{ ansible_os_family == 'Debian' }}"

    # A venv sidesteps PEP 668 (Debian 12+) and keeps mysql-connector off the system
    # python. tasks/main.yml runs qa_framework.py with the venv's python3, and the
    # framework starts each test with that same interpreter (sys.executable).
    # setuptools provides the "distutils" shim that util/pxc_startup.py imports on
    # Python >= 3.12.
    #
    # mysql-connector-python is pinned below 26: the 26.x C extension (_mysql_connector,
    # which pxc-qa's util/db_connection.py imports directly) needs OPENSSL_3.2.0. Its
    # bundled mysql/vendor/libssl.so.3 has it, but Python's ssl module has already
    # loaded the system libssl.so.3 (OpenSSL 3.0 on Debian 12 / OL9), so the import
    # fails with "version `OPENSSL_3.2.0' not found". 9.x wheels need only 3.0.0.
    # >=9.2.0: read/write timeouts used by db_connection.py. This resolves to 9.7.x on
    # Python 3.11 (debian-12) and 9.4.0 on Python 3.9 (oracle-9, last 3.9 wheel).
    - name: Create pxc-qa virtualenv with mysql-connector-python
      pip:
        name:
          - "mysql-connector-python>=9.2.0,<26"
          - setuptools
        virtualenv: "{{ qa_venv }}"
        virtualenv_command: python3 -m venv

    # Import in the same order a test does (ssl first, then the C extension), so a
    # connector/OpenSSL mismatch fails here instead of every test.
    - name: Check mysql-connector C extension imports in the venv
      command: >-
        {{ qa_venv }}/bin/python3 -c
        "import ssl, mysql.connector, _mysql_connector;
        print('mysql-connector-python', mysql.connector.__version__, '| system', ssl.OPENSSL_VERSION)"
      register: connector_check
      changed_when: false

    - name: Print mysql-connector check
      debug:
        msg: "{{ connector_check.stdout }}"

    - name: Checkout pxc-qa repository
      git:
        repo: "{{ lookup('env', 'PXC_QA_REPO') | default('https://github.com/Percona-QA/pxc-qa', true) }}"
        dest: "{{ qa_home }}/pxc-qa"
        version: "{{ lookup('env', 'PXC_QA_BRANCH') | default('master', true) }}"
        force: yes

    - name: Checkout pstress repository
      git:
        repo: https://github.com/Percona-QA/pstress.git
        dest: "{{ qa_home }}/pstress"
        version: "{{ lookup('env', 'PSTRESS_BRANCH') | default('master', true) }}"
        force: yes

    # pxc-qa loads test data with randgen (util/rqg_datagen.py: gendata.pl + conf/<module>)
    # in the correctness, replication, ssl and upgrade suites. percona-qa is ~1.7 GB,
    # so fetch only its randgen/ directory (shallow, blobless, sparse: ~35 MB).
    - name: Checkout randgen from percona-qa repository
      shell: |
        set -e
        rm -rf "{{ qa_home }}/percona-qa"
        git clone --depth 1 --filter=blob:none --sparse --branch "$PERCONA_QA_BRANCH" \
          "$PERCONA_QA_REPO" "{{ qa_home }}/percona-qa"
        git -C "{{ qa_home }}/percona-qa" sparse-checkout set randgen
        test -f "{{ qa_home }}/percona-qa/randgen/gendata.pl"
      environment:
        PERCONA_QA_REPO: "{{ lookup('env', 'PERCONA_QA_REPO') | default('https://github.com/Percona-QA/percona-qa.git', true) }}"
        PERCONA_QA_BRANCH: "{{ lookup('env', 'PERCONA_QA_BRANCH') | default('master', true) }}"

    - name: Give {{ qa_user }} ownership of its home (repos cloned as root)
      ansible.builtin.file:
        path: "{{ qa_home }}"
        state: directory
        owner: "{{ qa_user }}"
        group: "{{ qa_user }}"
        recurse: true

    # Fail in prepare, not an hour into a test, if randgen's perl modules are missing.
    # "perl -c" compiles gendata.pl and every GenTest module it uses (DBI, GDBM_File...);
    # DBD::mysql is only loaded at connect time, so check it separately.
    - name: Check randgen perl dependencies
      shell: |
        runuser -u {{ qa_user }} -- bash -c '
          set -e
          cd {{ qa_home }}/percona-qa/randgen
          perl -Ilib -c gendata.pl
          perl -MDBD::mysql -e "print qq(DBD::mysql \$DBD::mysql::VERSION\n)"
        '
      register: randgen_check
      changed_when: false

    - name: Print randgen check
      debug:
        msg: "{{ randgen_check.stdout_lines + randgen_check.stderr_lines }}"
