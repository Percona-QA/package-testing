---
dependency:
  name: galaxy
driver:
  name: ec2
platforms:
  - name: rocky-9-${BUILD_NUMBER}-${JOB_NAME}-${PLAYBOOK_VAR}
    region: us-west-2
    image:  ami-023eeffe03f0dd455
    vpc_subnet_id: subnet-0430e63d7cdbcd237
    instance_type: t2.large
    ssh_user: rocky
    root_device_name: /dev/sda1
    block_device_mappings:
      # ebs nested INSIDE the list item: playbooks/create_noble.yml reads
      # item.block_device_mappings[0].ebs.volume_size, so as a sibling key it
      # was silently ignored and the size fell back to default(30) -- these
      # instances got 30G, not the 40G asked for here.
      - device_name: /dev/sda1
        ebs:
          volume_size: 40
          volume_type: gp2
          delete_on_termination: true
    instance_tags:
      iit-billing-tag: ${IIT_BILLING_TAG}
      job-name: ${JOB_NAME}
      build-number: ${BUILD_NUMBER}
provisioner:
  name: ansible
  log: True
  playbooks:
    create: ../../playbooks/create_noble.yml
    destroy: ../../playbooks/destroy_noble.yml
    prepare: ../../playbooks/prepare.yml
    cleanup: ../../playbooks/cleanup.yml
    converge: ../../../../playbooks/${PLAYBOOK_VAR}.yml
scenario:
  name: rocky-9
  destroy_sequence:
    - destroy
  cleanup_sequence:
    - cleanup
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
