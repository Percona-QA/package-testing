- name: Prepare node for running tests
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true
  tasks:

    - name: Setup SSH keys for Oracle Linux or Amazon
      authorized_key:
        user: ec2-user
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution not in ["Rocky"]

    - name: Setup SSH keys for Rocky Linux
      authorized_key:
        user: rocky
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when:
        - ansible_distribution == "Rocky"

    - name: Setup SSH keys CentOS
      authorized_key:
        user: centos
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "CentOS"

    - name: Setup SSH keys Debian
      authorized_key:
        user: admin
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Debian"

    - name: Setup SSH keys Ubuntu
      authorized_key:
        user: ubuntu
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Ubuntu"

    # Several AMIs in this matrix boot with a root filesystem much smaller than
    # the volume attached to them (rocky-8 ships an 8.9G LV on a 30G disk), which
    # left too little room for the SBOM vulnerability scan and squeezes the
    # backup tests as well. No-ops on platforms with nothing to grow.
    - name: grow the root filesystem into unused disk space
      include_tasks: ../../../tasks/grow_root_fs.yml
