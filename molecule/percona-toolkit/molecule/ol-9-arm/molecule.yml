---
dependency:
  name: galaxy
driver:
  name: ec2
platforms:
  - name: ol9-arm-${BUILD_NUMBER}-${JOB_NAME}-${PLAYBOOK_VAR}
    region: us-west-2
    image: ami-01d0bd8fb71d8c3b1
    vpc_subnet_id: subnet-0430e63d7cdbcd237
    instance_type: c6g.large
    ssh_user: ec2-user
    root_device_name: /dev/sda1
    instance_tags:
      iit-billing-tag: ${IIT_BILLING_TAG}
      job-name: ${JOB_NAME}
      build-number: ${BUILD_NUMBER}
provisioner:
  name: ansible
  log: True
  playbooks:
    create: ../../../playbooks/create_noble.yml
    destroy: ../../../playbooks/destroy-noble-arm.yml
    prepare: ../../playbooks/prepare.yml
    converge: ../../../../playbooks/${PLAYBOOK_VAR}.yml
scenario:
  name: ol-9-arm
  destroy_sequence:
    - destroy
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy